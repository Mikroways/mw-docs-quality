# Validaciones de calidad de los diccionarios custom de Mikroways.

# Verifica que ninguna palabra nueva (agregada en este commit/MR) ya esté
# cubierta por algún diccionario activo (es-es, es-ar, aws, k8s, bash, docker, etc.).
validate-dict-builtin:
  stage: validate
  image: node:22.18.0-alpine
  cache:
    - key:
        files:
          - package.json
      paths:
        - node_modules/
  before_script:
    - apk add --no-cache git
    - npm install
  script:
    - |
      # Determinar el commit base: MR usa su base, push usa el commit anterior.
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE="$CI_COMMIT_BEFORE_SHA"
      else
        BASE=""
      fi

      if [ -n "$BASE" ]; then
        # || true: sin palabras nuevas, grep sale con 1 y pipefail cortaría el job
        # antes de llegar al "OK" de más abajo.
        words=$(git diff "$BASE" HEAD -- dictionaries/*.txt \
          | grep '^+[^+]' | grep -v '^+#' | grep -v '^+[[:space:]]*$' | sed 's/^+//' || true)
      else
        # Primer push a la branch: chequear todos los diccionarios.
        words=$(grep -h -v '^#' dictionaries/*.txt | grep -v '^[[:space:]]*$' || true)
      fi

      if [ -z "$words" ]; then
        echo "OK: no hay palabras nuevas en los diccionarios"
        exit 0
      fi

      failed=0
      cd cspell-test

      # Construir la lista de palabras como argumentos posicionales.
      wordsfile=$(mktemp)
      printf '%s\n' "$words" > "$wordsfile"
      set --
      while IFS= read -r word; do
        [ -z "$word" ] && continue
        set -- "$@" "$word"
      done < "$wordsfile"
      rm "$wordsfile"

      # Guardar el trace en archivo para evitar SIGPIPE al pipar una variable grande.
      tracefile=$(mktemp)
      ../node_modules/.bin/cspell trace --no-color "$@" > "$tracefile" 2>/dev/null || true

      for word in "$@"; do
        dict=$(awk -v w="$word" 'NR>1 && $1==w && $2=="*" && $3~/\*$/ {gsub(/\*$/, "", $3); print $3; exit}' "$tracefile")
        if [ -n "$dict" ]; then
          echo "ERROR: '$word' ya está cubierto por el diccionario '$dict'"
          failed=1
        fi
      done
      rm "$tracefile"
      [ "$failed" -eq 0 ] && echo "OK"
      exit $failed

# Verifica que no haya palabras repetidas entre los diferentes diccionarios.
validate-dict-duplicates:
  stage: validate
  image: alpine:3.21
  script:
    - |
      dups=$(cat dictionaries/*.txt | grep -v "^#" | grep -v "^[[:space:]]*$" | sort | uniq -d)
      if [ -n "$dups" ]; then
        echo "ERROR: palabras duplicadas entre diccionarios:"
        printf '%s\n' "$dups"
        exit 1
      fi
      echo "OK: no hay palabras duplicadas"

# Verifica que las palabras de cada sección estén en orden alfabético (locale es).
validate-dict-order:
  stage: validate
  image: node:22.18.0-alpine
  script:
    - node scripts/sort-dict.js --check dictionaries/*.txt

# El trie de es-AR se genera de dictionary-es-ar con `npm run build:es-ar`
# (ver README). Se compara el contenido descomprimido: la compilación es
# determinista, pero el gzip puede variar entre versiones de zlib.
validate-es-ar-trie:
  stage: validate
  image: node:22.18.0-alpine
  script:
    - npm install
    - gunzip -c dictionaries/es-ar.trie.gz > /tmp/es-ar.commiteado
    - npm run build:es-ar
    - gunzip -c dictionaries/es-ar.trie.gz > /tmp/es-ar.generado
    - cmp /tmp/es-ar.commiteado /tmp/es-ar.generado
